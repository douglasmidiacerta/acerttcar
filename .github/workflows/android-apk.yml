name: Compilar Control v1.5 (sem assinatura)
on:
  push:
    branches: [acertt-control-v1-5-diagnostico]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extrair codigo fonte
        run: |
          base64 -d android-source.b64 > source.zip
          unzip -oq source.zip -d .
          test -f app/build.gradle
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' || true
      - name: Compilar APK release
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: AcerttAIControl-v15-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
