name: Compilar Control v1.5 (sem assinatura)
on:
  push:
    branches: [acertt-control-v1-5-diagnostico]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extrair codigo fonte
        run: |
          base64 -d android-source.b64 > source.zip
          unzip -oq source.zip -d .
          test -f app/build.gradle
      - name: Preparar SDK Android sem setup-android
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK release
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: AcerttAIControl-v15-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
