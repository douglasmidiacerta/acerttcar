name: Compilar Acertt AI Control v1.3
on:
  push:
    branches: [acertt-ai-control-v1-3]
    paths:
      - control-source-v1_3.b64
      - .github/workflows/acertt-control-v13.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extrair fonte separada
        run: |
          base64 -d control-source-v1_3.b64 > /tmp/acertt-control-source.zip
          mkdir -p control-src
          unzip -oq /tmp/acertt-control-source.zip -d control-src
          test -f control-src/app/src/main/java/br/com/acerttcar/monitor/MainActivity.java
      - name: Instalar Android SDK 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar Acertt AI Control
        run: gradle -p control-src :app:assembleDebug --no-daemon
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Acertt-AI-Control-v1-3
          path: control-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
