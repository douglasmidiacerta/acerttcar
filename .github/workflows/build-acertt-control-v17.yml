name: Compilar Acertt AI Control v1.7 (unsigned)
on:
  push:
    branches:
      - fix/acertt-control-v17-progresso
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair fonte v1.7
        run: |
          base64 -d acertt-control-v17-source.b64 > source.zip
          unzip -oq source.zip -d .
          test -f app/build.gradle
          grep "versionCode 17" app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' || true
      - name: Compilar release sem assinatura
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: AcerttAIControl-v17-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
